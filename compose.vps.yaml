name: livro-medicina
services:
  livro:
    build:
      context: .
      dockerfile: Dockerfile.vps
    restart: unless-stopped
    init: true
    env_file: .env.vps
    ports:
      - "127.0.0.1:3080:3000"
    volumes:
      - livro_data:/data
    mem_limit: 768m
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  livro_data:
